<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layout test</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #050208; }
  #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .room { position: fixed; inset: 0; z-index: 1; }
  .room-svg { width: 100%; height: 100%; }

  @keyframes screen-flicker { 0%,100%{opacity:.55} 50%{opacity:.85} }
  @keyframes rim-pulse { 0%,100%{opacity:.65} 50%{opacity:1} }
  @keyframes hud-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="room" aria-hidden="true">
  <svg class="room-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="nebula" cx="50%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#7a3fb0" stop-opacity=".4"/>
        <stop offset="45%" stop-color="#3a1a5c" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#0a0414" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="glassTint" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d8b4fe" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="consoleTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a1e58"/>
        <stop offset="100%" stop-color="#160a2c"/>
      </linearGradient>
      <linearGradient id="consoleFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1c0e34"/>
        <stop offset="100%" stop-color="#08040e"/>
      </linearGradient>
      <radialGradient id="hudGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#c9a8f5" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#c9a8f5" stop-opacity="0"/>
      </radialGradient>
      <filter id="softBlur"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>

    <rect width="1600" height="900" fill="#0a0414"/>
    <rect width="1600" height="900" fill="url(#nebula)"/>
    <g fill="#f7f2ff" opacity=".7">
      <circle cx="220" cy="140" r="1.4"/><circle cx="380" cy="220" r="1.1"/><circle cx="520" cy="120" r="1.5"/>
      <circle cx="700" cy="180" r="1.2"/><circle cx="900" cy="130" r="1.4"/><circle cx="1080" cy="210" r="1.1"/>
      <circle cx="1220" cy="150" r="1.5"/><circle cx="1380" cy="230" r="1.2"/><circle cx="150" cy="300" r="1.1"/>
      <circle cx="1450" cy="300" r="1.3"/><circle cx="800" cy="90" r="1.3"/><circle cx="600" cy="260" r="1.1"/>
      <circle cx="1000" cy="270" r="1.2"/>
    </g>

    <path d="M -60,300 C 420,20 1180,20 1660,300" fill="none" stroke="#c9a8f5" stroke-width="26" opacity=".18" filter="url(#softBlur)"/>
    <path d="M -60,300 C 420,20 1180,20 1660,300 L 1660,340 C 1180,60 420,60 -60,340 Z" fill="url(#glassTint)"/>
    <path d="M -60,300 C 420,20 1180,20 1660,300" fill="none" stroke="#f7f2ff" stroke-width="5" opacity=".9" style="animation: rim-pulse 5s ease-in-out infinite;"/>
    <path d="M -60,300 C 420,20 1180,20 1660,300" fill="none" stroke="#d84fc4" stroke-width="2" opacity=".4"/>

    <path d="M40,900 L40,760 Q280,600 800,588 Q1320,600 1560,760 L1560,900 Z" fill="url(#consoleTop)"/>
    <path d="M60,900 L60,790 Q290,650 800,640 Q1310,650 1540,790 L1540,900 Z" fill="url(#consoleFront)"/>
    <path d="M40,760 Q280,600 800,588 Q1320,600 1560,760" fill="none" stroke="#e8b878" stroke-width="2.5" opacity=".55" style="animation: rim-pulse 4.5s ease-in-out infinite;"/>

    <g transform="translate(800,660)">
      <circle r="70" fill="url(#hudGlow)"/>
      <circle r="52" fill="#08040e" opacity=".8"/>
      <circle r="52" fill="none" stroke="#c9a8f5" stroke-width="1.5" opacity=".5"/>
      <circle r="34" fill="none" stroke="#c9a8f5" stroke-width="1" opacity=".3"/>
      <line x1="-52" y1="0" x2="52" y2="0" stroke="#c9a8f5" stroke-width="1" opacity=".25"/>
      <line x1="0" y1="-52" x2="0" y2="52" stroke="#c9a8f5" stroke-width="1" opacity=".25"/>
      <circle cx="0" cy="-20" r="4" fill="#d84fc4" opacity=".8" style="animation: screen-flicker 3s ease-in-out infinite;"/>
      <circle cx="14" cy="10" r="3" fill="#e8b878" opacity=".7"/>
      <g style="animation: hud-spin 14s linear infinite; transform-origin: 0 0;">
        <line x1="0" y1="0" x2="0" y2="-46" stroke="#c9a8f5" stroke-width="1.5" opacity=".5"/>
      </g>
    </g>

    <g transform="translate(500,680) skewY(-4) scale(1,0.94)">
      <rect x="-70" y="-46" width="140" height="92" rx="6" fill="#0c0620" stroke="#c9a8f5" stroke-width="1.4" opacity=".9"/>
      <rect x="-58" y="-34" width="70" height="10" rx="2" fill="#c9a8f5" opacity=".45"/>
      <rect x="-58" y="-18" width="116" height="4" fill="#e8b878" opacity=".6" style="animation: screen-flicker 3.4s ease-in-out infinite;"/>
      <rect x="-58" y="-8" width="80" height="4" fill="#c9a8f5" opacity=".35"/>
      <rect x="-58" y="2" width="100" height="4" fill="#d84fc4" opacity=".4" style="animation: screen-flicker 3.4s ease-in-out infinite .8s;"/>
      <rect x="-58" y="14" width="60" height="4" fill="#c9a8f5" opacity=".3"/>
      <circle cx="46" cy="30" r="6" fill="#e8b878" opacity=".55"/>
    </g>

    <g transform="translate(280,760) skewY(-9) scale(1,0.88)">
      <rect x="-80" y="-50" width="160" height="100" rx="6" fill="#0c0620" stroke="#c9a8f5" stroke-width="1.4" opacity=".9"/>
      <rect x="-64" y="-36" width="90" height="12" rx="2" fill="#d84fc4" opacity=".4"/>
      <rect x="-64" y="-16" width="130" height="4" fill="#c9a8f5" opacity=".4" style="animation: screen-flicker 3.8s ease-in-out infinite .4s;"/>
      <rect x="-64" y="-4" width="100" height="4" fill="#e8b878" opacity=".45"/>
      <rect x="-64" y="8" width="70" height="4" fill="#c9a8f5" opacity=".3"/>
      <rect x="-64" y="20" width="110" height="4" fill="#d84fc4" opacity=".35" style="animation: screen-flicker 3.8s ease-in-out infinite 1.2s;"/>
    </g>

    <g transform="translate(1100,680) skewY(4) scale(1,0.94)">
      <rect x="-70" y="-46" width="140" height="92" rx="6" fill="#0c0620" stroke="#c9a8f5" stroke-width="1.4" opacity=".9"/>
      <rect x="-12" y="-34" width="70" height="10" rx="2" fill="#c9a8f5" opacity=".45"/>
      <rect x="-58" y="-18" width="116" height="4" fill="#c9a8f5" opacity=".35"/>
      <rect x="-58" y="-8" width="80" height="4" fill="#e8b878" opacity=".55" style="animation: screen-flicker 3.6s ease-in-out infinite .6s;"/>
      <rect x="-42" y="2" width="100" height="4" fill="#d84fc4" opacity=".4"/>
      <rect x="-58" y="14" width="60" height="4" fill="#c9a8f5" opacity=".3" style="animation: screen-flicker 3.6s ease-in-out infinite 1.6s;"/>
      <circle cx="-46" cy="30" r="6" fill="#c9a8f5" opacity=".5"/>
    </g>

    <g transform="translate(1320,760) skewY(9) scale(1,0.88)">
      <rect x="-80" y="-50" width="160" height="100" rx="6" fill="#0c0620" stroke="#c9a8f5" stroke-width="1.4" opacity=".9"/>
      <rect x="-26" y="-36" width="90" height="12" rx="2" fill="#e8b878" opacity=".4"/>
      <rect x="-64" y="-16" width="130" height="4" fill="#d84fc4" opacity=".4" style="animation: screen-flicker 4.2s ease-in-out infinite .3s;"/>
      <rect x="-64" y="-4" width="100" height="4" fill="#c9a8f5" opacity=".35"/>
      <rect x="-64" y="8" width="70" height="4" fill="#e8b878" opacity=".4" style="animation: screen-flicker 4.2s ease-in-out infinite 1.4s;"/>
      <rect x="-64" y="20" width="110" height="4" fill="#c9a8f5" opacity=".3"/>
    </g>

  </svg>
</div>

<script>
(function(){
  const cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d');
  let W,H;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);
  const PAL=[[216,79,196],[201,168,245],[232,184,120]];
  const rnd=(a,b)=>a+Math.random()*(b-a); const pick=()=>PAL[Math.floor(Math.random()*PAL.length)];
  class Mote{constructor(i){this.r(i);}
    r(i){this.x=rnd(0,W);this.y=i?rnd(0,H):rnd(0,H*.6);this.vx=rnd(-.02,.02);this.vy=rnd(.01,.05);this.col=pick();this.sz=rnd(.5,1.6);this.op=rnd(.04,.1);this.ph=rnd(0,Math.PI*2);this.ps=rnd(.008,.02);}
    step(){this.x+=this.vx;this.y+=this.vy;this.ph+=this.ps;if(this.y>H+10)this.r(false);if(this.x<-10)this.x=W+10;if(this.x>W+10)this.x=-10;}
    draw(){const p=.5+.5*Math.sin(this.ph),op=this.op*(.5+.5*p),[r,g,b]=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);ctx.fillStyle=`rgba(${r},${g},${b},${op})`;ctx.fill();}
  }
  const motes=Array.from({length: window.matchMedia('(max-width:600px)').matches?14:24},()=>new Mote(true));
  (function loop(){ctx.clearRect(0,0,W,H);motes.forEach(m=>{m.step();m.draw();});requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
